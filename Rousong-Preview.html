<div class="app"><header><div class="brand"><svg class="paw" viewBox="0 0 30 30" fill="currentColor"><ellipse cx="9" cy="9" rx="3" ry="4" transform="rotate(-20 9 9)"/><ellipse cx="17" cy="7" rx="3" ry="4"/><ellipse cx="24" cy="11" rx="3" ry="4" transform="rotate(20 24 11)"/><path d="M7 22c0-5 5-10 9-10s9 5 9 10c0 4-5 4-9 2-4 2-9 2-9-2Z"/></svg>肉松的小日子</div><div class="saving" id="saveStatus">只保存在这台设备</div></header>
<div class="intro"><h1>今天也和<em>肉松</em>一起。</h1><p>吃饱，喝水，打个盹。你忙你的，我陪着你。</p></div>
<main class="layout"><section class="room" aria-label="肉松的活动空间"><div class="room-label">LITTLE EVERYDAY MOMENTS<span>一只猫，一段慢时光</span></div><div class="room-tag">写实 · 肉松</div><div class="floor"></div><div class="vase"><i class="leaf"></i><i class="leaf"></i></div><div id="stage"><div id="speech" role="status"></div><div id="petWrap" role="button" tabindex="0" aria-label="摸摸肉松，也可以拖动它"><canvas id="petCanvas" width="400" height="400"></canvas></div></div><div class="stage-bottom"><div class="name-tag"><b>肉松</b><i class="dot"></i><span id="stageState">安静陪着你</span></div><div class="hint">点一下摸摸 · 拖动陪你</div></div></section>
<aside class="care" aria-label="照顾肉松"><h2>照顾一下小家伙</h2><p class="caption" id="activity">安静陪着你</p>
<div class="metric"><label>饱腹</label><div class="track" id="foodTrack" role="progressbar" aria-label="饱腹" aria-valuemin="0" aria-valuemax="100"><div class="bar" id="foodBar" style="background:#c8a47d"></div></div><output id="foodValue">82</output></div>
<div class="metric"><label>饮水</label><div class="track" id="waterTrack" role="progressbar" aria-label="饮水" aria-valuemin="0" aria-valuemax="100"><div class="bar" id="waterBar" style="background:#93b7b0"></div></div><output id="waterValue">86</output></div>
<div class="metric"><label>精力</label><div class="track" id="energyTrack" role="progressbar" aria-label="精力" aria-valuemin="0" aria-valuemax="100"><div class="bar" id="energyBar" style="background:#b0bb90"></div></div><output id="energyValue">78</output></div>
<div class="metric"><label>心情</label><div class="track" id="moodTrack" role="progressbar" aria-label="心情" aria-valuemin="0" aria-valuemax="100"><div class="bar" id="moodBar" style="background:#d1a391"></div></div><output id="moodValue">88</output></div>
<div class="actions"><button class="action eat" data-action="eat"><svg><use href="#food-icon"/></svg>喂食</button><button class="action drink" data-action="drink"><svg><use href="#water-icon"/></svg>喂水</button><button class="action pet" data-action="pet"><svg><use href="#heart-icon"/></svg>摸摸它</button><button class="action sleep" id="sleepButton" data-action="sleep"><svg><use href="#moon-icon"/></svg><span id="sleepLabel">睡一会儿</span></button></div>
<div class="toy-actions" aria-label="肉松的小动作"><button data-action="stretch">伸懒腰</button><button data-action="butterfly">追蝴蝶</button><button data-action="ball">玩小球</button><button data-action="scratch">磨磨爪</button><button data-action="yawn">打哈欠</button><button data-action="roll">躺下打滚</button></div><div class="note" id="message" aria-live="polite">摸摸小猫，日子慢一点。</div><div class="settings"><div class="setting"><span>让肉松自己走走</span><label class="switch"><input type="checkbox" id="wander" checked aria-label="允许随机走动">开启</label></div><div class="setting"><span>偶尔自己玩一会儿</span><label class="switch"><input type="checkbox" id="playful" checked aria-label="允许随机玩耍">开启</label></div><div class="setting"><label for="size">小猫大小</label><input id="size" type="range" min="0.75" max="1.18" value="1" step="0.01"></div></div>
<div class="counts"><span><b id="countMeals">0</b>好好吃饭</span><span><b id="countDrinks">0</b>乖乖喝水</span><span><b id="countPats">0</b>被爱时刻</span></div></aside></main>
<footer><span><span class="small-icon">♡</span>不用一直照顾，也会一直陪着你。</span><span>互动预览 · 与桌面版独立存档</span></footer></div>
